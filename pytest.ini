[pytest]
pythonpath = .
testpaths = tests
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=90
# Aviso de deprecacao vindo do proprio codigo ou das dependencias quebra a suite: e assim
# que a troca httpx -> httpx2 no TestClient deixa de passar despercebida.
filterwarnings =
    error::DeprecationWarning
